<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrievanceAI - Brand Governance Platform</title>
    <style>
      /* Friendly Render Cold Start Pre-React Splash */
      #preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F8FAFC;
        color: #0F172A;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .preloader-card {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 14px;
        padding: 32px 24px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid #EEF2FF;
        border-top: 3px solid #4F46E5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 18px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .preloader-title {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .preloader-title span { color: #4F46E5; }
      .preloader-subtitle {
        font-size: 0.875rem;
        color: #64748B;
        line-height: 1.45;
        margin-bottom: 16px;
      }
      .preloader-notice {
        background: #F1F5F9;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.8rem;
        color: #475569;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="preloader">
        <div className="preloader-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:32px 24px;max-width:440px;width:100%;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">
          <div class="preloader-spinner"></div>
          <h2 class="preloader-title">Grievance<span>AI</span></h2>
          <p class="preloader-subtitle">Loading brand governance workspace &amp; compliance rules...</p>
          <div class="preloader-notice">
            ⚡ <strong>Render Free Tier Notice:</strong> If this is a cold start after inactivity, please allow ~30 seconds for the web service to wake up.
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
